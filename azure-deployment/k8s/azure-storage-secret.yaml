# azure-storage-secret.yaml — TEMPLATE ONLY
#
# The actual secret is created by deploy-azure-infra.sh via:
#   kubectl create secret generic azure-storage-secret \
#     --namespace flink \
#     --from-literal=storage-account-name="<account>" \
#     --from-literal=storage-account-key="<key>"
#
# DO NOT commit real values. If you need to apply manually, base64-encode:
#   echo -n "your-account-name" | base64
#   echo -n "your-account-key"  | base64
#
apiVersion: v1
kind: Secret
metadata:
  name: azure-storage-secret
  namespace: flink
type: Opaque
data:
  storage-account-name: <base64-encoded-account-name>
  storage-account-key: <base64-encoded-account-key>
