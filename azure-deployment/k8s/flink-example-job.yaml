# Note: ${STORAGE_ACCOUNT}, ${STORAGE_KEY}, ${CONTAINER_NAME} are substituted
# at deploy time by deploy-flink.sh using envsubst. Do not hardcode these values.
apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  name: flink-example-job
  namespace: flink
spec:
  image: ${ACR_LOGIN_SERVER}/flink:1.20
  flinkVersion: v1_20
  flinkConfiguration:
    taskmanager.numberOfTaskSlots: "4"
    state.backend: rocksdb
    state.backend.rocksdb.memory.managed: "true"
    state.checkpoints.dir: "abfss://${CONTAINER_NAME}@${STORAGE_ACCOUNT}.dfs.core.windows.net/checkpoints"
    state.savepoints.dir: "abfss://${CONTAINER_NAME}@${STORAGE_ACCOUNT}.dfs.core.windows.net/savepoints"
    fs.azure.account.key.${STORAGE_ACCOUNT}.dfs.core.windows.net: "${STORAGE_KEY}"
    execution.checkpointing.interval: "60000"
    execution.checkpointing.mode: EXACTLY_ONCE
  serviceAccount: flink
  podTemplate:
    spec:
      initContainers:
        - name: azure-fs-plugin-installer
          image: ${ACR_LOGIN_SERVER}/flink:1.20
          command:
            - /bin/sh
            - -c
            - |
              mkdir -p /plugins/azure-fs-hadoop
              cp /opt/flink/opt/flink-azure-fs-hadoop-*.jar /plugins/azure-fs-hadoop/
          volumeMounts:
            - name: flink-plugins
              mountPath: /plugins
      containers:
        - name: flink-main-container
          env:
            - name: AZURE_STORAGE_ACCOUNT
              valueFrom:
                secretKeyRef:
                  name: azure-storage-secret
                  key: storage-account-name
            - name: AZURE_STORAGE_KEY
              valueFrom:
                secretKeyRef:
                  name: azure-storage-secret
                  key: storage-account-key
          volumeMounts:
            - name: flink-plugins
              mountPath: /opt/flink/plugins
      volumes:
        - name: flink-plugins
          emptyDir: {}
  jobManager:
    resource:
      memory: "2048m"
      cpu: 1
  taskManager:
    resource:
      memory: "2048m"
      cpu: 2
  job:
    jarURI: local:///opt/flink/examples/streaming/StateMachineExample.jar
    parallelism: 4
    upgradeMode: savepoint
